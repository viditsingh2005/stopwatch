<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Stopwatch</title>

    <link rel="stylesheet" href="2.css">
</head>

<body>

    <div class="container">

        <h1>STOPWATCH</h1>

        <div class="stopwatch-box">

            <!-- Timer -->
            <div class="timer" id="display">
                00:00:00.00
            </div>

            <!-- Buttons -->
            <div class="buttons">

                <button id="startBtn" class="start-btn">
                    Start
                </button>

                <button id="pauseBtn" class="pause-btn">
                    Pause
                </button>

                <button id="lapBtn" class="lap-btn">
                    Lap
                </button>

                <button id="resetBtn" class="reset-btn">
                    Reset
                </button>

            </div>

            <!-- Lap Times -->
            <div class="lap-section">

                <h2>Lap Times</h2>

                <div id="lapList"></div>

            </div>

        </div>

    </div>

    <script src="3.js"></script>

</body>

</html>
